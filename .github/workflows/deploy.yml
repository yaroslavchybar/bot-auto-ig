# Sole deploy path: push to main. Nothing is deployed by hand —
# not Convex (`convex deploy`), not the VPS. PRs only run checks.
#
# Order per push to main: checks -> Convex prod (functions, skipped when the
# commit touches nothing under convex/) -> images (built here, pushed to
# GHCR) -> VPS (pull + up + Caddy reload). Each step runs only if the
# previous one succeeded.
#
# Required GitHub secrets: CONVEX_DEPLOY_KEY, VPS_SSH_KEY, VPS_KNOWN_HOSTS,
# CONVEX_URL, INTERNAL_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_BOT_USERNAME,
# TELEGRAM_ADMIN_ID, CLOAKBROWSER_LICENSE_KEY.
# Required GitHub vars: VPS_HOST, VPS_USER, APP_PUBLIC_URL, VITE_API_URL,
# VITE_CONVEX_URL.
name: deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_NAME: ghcr.io/yaroslavchybar/bot-auto-ig

jobs:
  verify:
    runs-on: ubuntu-latest
    # Dummy values: server tests stub fetch, they only need the vars present
    # at import time. Never point checks at a real deployment.
    env:
      CONVEX_URL: https://ci-test.convex.cloud
      INTERNAL_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test server
      - run: bun run test:convex
      - run: bun run build
      - run: bun run typecheck

  changes:
    runs-on: ubuntu-latest
    outputs:
      convex: ${{ steps.filter.outputs.convex }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            convex:
              - 'convex/**'

  deploy-convex:
    needs: [verify, changes]
    if: github.event_name == 'push' && needs.changes.outputs.convex == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Prod Convex (schema, functions, indexes). The key scopes this to
      # the prod deployment; the flag allows prod deploys from CI runners.
      - run: bunx convex deploy --check-build-environment disable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  build-images:
    needs: [verify, changes, deploy-convex]
    # Serialize image pushes + VPS deploys: concurrent pushes to main
    # otherwise race (one run's `rm -rf ~/ig-bot/app` deletes the cwd of
    # another run's deploy shell, which fails with
    # `getwd: no such file or directory`). Images are tagged immutably
    # per commit below, so a queued run can never deploy another run's
    # images.
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    # Runs when Convex deployed OR was skipped (no convex/ changes).
    # `always()` is needed so a skipped deploy-convex doesn't skip this.
    if: ${{ always() && github.event_name == 'push' && needs.verify.result == 'success' && needs.changes.result == 'success' && (needs.deploy-convex.result == 'success' || needs.deploy-convex.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: server
            dockerfile: server/Dockerfile
            tag: server
          - service: frontend
            dockerfile: frontend/Dockerfile
            tag: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server
        if: matrix.service == 'server'
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./${{ matrix.dockerfile }}
          target: server-runtime
          build-contexts: |
            repo_root=.
          pull: true
          push: true
          # Immutable per-commit tag: deploy-vps pulls this exact revision,
          # so a queued run can never mix or replace these images.
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Pro browser binary: the key is a secret mount, never baked in.
          secrets: |
            cloak_key=${{ secrets.CLOAKBROWSER_LICENSE_KEY }}

      - name: Build and push frontend
        if: matrix.service == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./${{ matrix.dockerfile }}
          target: frontend-runtime
          build-contexts: |
            repo_root=.
            convex_src=./convex
          pull: true
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_CONVEX_URL=${{ vars.VITE_CONVEX_URL }}

  deploy-vps:
    needs: [verify, changes, deploy-convex, build-images]
    # Same group as build-images: only one prod deploy touches the VPS
    # at a time.
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    if: ${{ always() && github.event_name == 'push' && needs.verify.result == 'success' && needs.changes.result == 'success' && (needs.deploy-convex.result == 'success' || needs.deploy-convex.result == 'skipped') && needs.build-images.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/ci-key
          chmod 600 ~/.ssh/ci-key
          # Pinned VPS host key (repo secret VPS_KNOWN_HOSTS). Never
          # ssh-keyscan here: it trusts whatever the network returns, so a
          # MITM could impersonate the VPS and harvest the .env secrets
          # sent over the session below.
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Ship code
        run: |
          git archive HEAD | ssh -i ~/.ssh/ci-key -o BatchMode=yes ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} 'set -e
          rm -rf ~/ig-bot/app.new
          mkdir -p ~/ig-bot/app.new
          tar -x -C ~/ig-bot/app.new
          rm -rf ~/ig-bot/app.prev
          if [ -e ~/ig-bot/app ]; then mv ~/ig-bot/app ~/ig-bot/app.prev; fi
          mv ~/ig-bot/app.new ~/ig-bot/app
          rm -rf ~/ig-bot/app.prev'

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/ci-key -o BatchMode=yes ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} <<'EOF'
          set -e
          cd ~/ig-bot/app
          # Fresh prod env every deploy. Dev login stays off in prod.
          cat > .env <<ENV
          NODE_ENV=production
          # Immutable image revision built above; Compose interpolates it
          # into the :server-<sha> / :frontend-<sha> image tags.
          IMAGE_TAG=${{ github.sha }}
          SERVER_PORT=3001
          DISPLAY=:99
          ALLOWED_ORIGINS=${{ vars.APP_PUBLIC_URL }}
          # Public HTTPS base the Telegram login webhook registers against.
          PUBLIC_BASE_URL=${{ vars.APP_PUBLIC_URL }}
          CONVEX_URL=${{ secrets.CONVEX_URL }}
          INTERNAL_API_KEY=${{ secrets.INTERNAL_API_KEY }}
          # CloakBrowser Pro key: server passes it to every launch, and the
          # Pro binary reads it from its own env at startup.
          CLOAKBROWSER_LICENSE_KEY=${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME=${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_ADMIN_ID=${{ secrets.TELEGRAM_ADMIN_ID }}
          ENV
          chmod 600 .env
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          cp deploy/ig-bot.caddy ~/caddy/conf.d/ig-bot.caddy
          docker exec caddy caddy reload --config /etc/caddy/Caddyfile
          sleep 5
          # Health through the frontend proxy; proves nginx + server are up.
          curl -sf http://127.0.0.1:3101/api/health > /dev/null
          EOF
