services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: server-runtime
      additional_contexts:
        repo_root: .
    ports:
      - "3001:3001"
      - "6080:6080"
      - "6081-6130:6081-6130"
    volumes:
      - ./data:/app/data
    env_file:
      - .env.local
    environment:
      - SERVER_PORT=3001
      - DISPLAY=:99
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - TELEGRAM_ADMIN_ID=${TELEGRAM_ADMIN_ID}
      - DATAUPLOADER_URL=${DATAUPLOADER_URL:-http://datauploader:3002}
      - DATAUPLOADER_ENV=${DATAUPLOADER_ENV:-dev}
      - DATAUPLOADER_DEST_ENVIRONMENTS=${DATAUPLOADER_DEST_ENVIRONMENTS:-dev}
      - DATAUPLOADER_ACCOUNT_STATUS=${DATAUPLOADER_ACCOUNT_STATUS:-available}
    restart: unless-stopped

  datauploader:
    build:
      context: ./datauploader
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    volumes:
      - ./data/uploads:/app/uploads
    env_file:
      - .env.local
    environment:
      - CONVEX_URL_DEV=${CONVEX_URL_DEV}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: frontend-runtime
      additional_contexts:
        repo_root: .
        convex_src: ./convex
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
        VITE_CONVEX_URL: ${VITE_CONVEX_URL}
        VITE_DATAUPLOADER_URL: ${VITE_DATAUPLOADER_URL:-http://localhost:3002}
    env_file:
      - .env.local
    environment:
      - PORT=80
    ports:
      - "5173:80"
    depends_on:
      - server
      - datauploader
    restart: unless-stopped
