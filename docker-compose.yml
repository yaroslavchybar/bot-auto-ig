services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: server-runtime
      additional_contexts:
        repo_root: .
    ports:
      - "3001:3001"
      - "6080:6080"
      - "6081-6130:6081-6130"
    volumes:
      - ./data:/app/data
    env_file:
      - .env.local
    environment:
      - SERVER_PORT=3001
      - DISPLAY=:99
      # Same persisted-cache reasoning as prod: the 70MB GeoIP db and the
      # browser binary survive container recreates.
      - CLOAKBROWSER_CACHE_DIR=/app/data/.cloakbrowser
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - TELEGRAM_ADMIN_ID=${TELEGRAM_ADMIN_ID}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: frontend-runtime
      additional_contexts:
        repo_root: .
        convex_src: ./convex
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
        VITE_CONVEX_URL: ${VITE_CONVEX_URL}
    env_file:
      - .env.local
    environment:
      - PORT=80
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped
