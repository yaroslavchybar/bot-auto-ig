services:
  spoofer:
    build:
      context: ./tools/spoofer
      dockerfile: Dockerfile
      additional_contexts:
        repo_root: .
    volumes:
      - ./data:/app/data
    cpus: 0.45
    mem_limit: 768m
    pids_limit: 64
    ports:
      - "127.0.0.1:3002:3002"
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: server-runtime
      additional_contexts:
        repo_root: .
    ports:
      - "3001:3001"
      - "6080:6080"
      - "6081-6130:6081-6130"
    volumes:
      - ./data:/app/data
    env_file:
      - .env.local
    environment:
      - SERVER_PORT=3001
      - SPOOFER_URL=http://spoofer:3002/variants
      - DISPLAY=:99
      # Same persisted-cache reasoning as prod: the 70MB GeoIP db and the
      # browser binary survive container recreates.
      - CLOAKBROWSER_CACHE_DIR=/app/data/.cloakbrowser
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - TELEGRAM_ADMIN_ID=${TELEGRAM_ADMIN_ID}
    restart: unless-stopped
    depends_on:
      - spoofer
    # Match production: allow server cleanup before display services stop.
    stop_grace_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: frontend-runtime
      additional_contexts:
        repo_root: .
        convex_src: ./convex
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
        VITE_CONVEX_URL: ${VITE_CONVEX_URL}
    env_file:
      - .env.local
    environment:
      - PORT=80
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped
