[package]
name = "ig-runtime"
version = "1.0.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
ig-service-common = { path = "../service-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "json",
  "stream",
  "socks",
  "gzip",
  "brotli",
  "deflate",
  "query",
  "http2",
  "form",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio-tungstenite = "0.29"
tower-http = { version = "0.6", features = ["limit"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rsa = "0.9"
aes-gcm = "0.10"
sha1 = "0.10"
rand = "0.8"
regex = "1"
cookie_store = { version = "0.22", features = ["serde_json"] }
tokio-util = { version = "0.7", features = ["io"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
convex = { version = "0.10.4", default-features = false, features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
chrono-tz = "0.10.4"
jpeg-encoder = { version = "0.7", features = ["simd"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
