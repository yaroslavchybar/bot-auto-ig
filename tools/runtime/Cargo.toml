[package]
name = "ig-runtime"
version = "1.0.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
ig-service-common = { path = "../service-common" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
tempfile = "3.27.0"
uuid = { version = "1.28.0", features = ["v4"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "json",
  "stream",
  "socks",
  "gzip",
  "brotli",
  "deflate",
  "query",
  "http2",
  "form",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.23.1"
hmac = "0.13.0"
sha2 = "0.11.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tokio-tungstenite = "0.30.0"
tower-http = { version = "0.7.1", features = ["limit"] }
aes-gcm = "0.11.1"
rand = "0.10.3"
regex = "1.13.1"
tokio-util = { version = "0.7", features = ["io"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
convex = { version = "0.10.4", default-features = false, features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
chrono-tz = "0.10.4"
jpeg-encoder = { version = "0.7", features = ["simd"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["xtest"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
