[package]
name = "ig-runtime"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
ig-service-common = { path = "../service-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
