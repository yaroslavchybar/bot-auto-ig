[package]
name = "spoof"
version = "2.0.0"
edition = "2021"
description = "Instagram image variant tool"

[lints]
workspace = true

[[bin]]
name = "spoof"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "signal", "time"] }
ig-service-common = { path = "../service-common" }
jpeg-encoder = { version = "0.7", features = ["simd"] }
