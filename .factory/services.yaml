commands:
  install_root: npm install
  install_frontend: cd frontend && npm install
  install_server: cd server && npm install
  install_python: pip install -r python/requirements.txt
  build_server: npm --prefix server run build
  test_server: "python -c \"import pathlib, subprocess, sys; root=pathlib.Path(r'C:\\\\Users\\\\yaros\\\\Downloads\\\\bot-auto-ig\\\\server'); tests=sorted(str(p.resolve()) for p in root.rglob('*.test.ts') if 'node_modules' not in p.parts and 'dist' not in p.parts); print(tests); rc=0\nfor test in tests:\n    result=subprocess.run(['npm.cmd','--prefix','server','exec','tsx','--test',test])\n    rc=result.returncode\n    if rc:\n        break\nsys.exit(rc)\""
  build_frontend: npm --prefix frontend run build
  lint_frontend: npm --prefix frontend run lint
  test_convex: npm run test:convex
  test_python: python -m pytest python/tests -q
  stop_server_exec_safe: "powershell -Command '$connections = Get-NetTCPConnection -LocalPort 3001 -ErrorAction SilentlyContinue; foreach ($connection in $connections) { Stop-Process -Id $connection.OwningProcess -Force -ErrorAction SilentlyContinue }; exit 0'"
  stop_frontend_exec_safe: "powershell -Command '$connections = Get-NetTCPConnection -LocalPort 5173 -ErrorAction SilentlyContinue; foreach ($connection in $connections) { Stop-Process -Id $connection.OwningProcess -Force -ErrorAction SilentlyContinue }; exit 0'"
  test_all: npm run test:convex && python -m pytest python/tests -q && npm --prefix server run build && npm --prefix frontend run build && npm --prefix frontend run lint

services:
  server:
    start: npm --prefix server run dev
    stop: powershell -Command "Get-NetTCPConnection -LocalPort 3001 -ErrorAction SilentlyContinue | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }"
    healthcheck: powershell -Command "try { Invoke-WebRequest -Uri 'http://localhost:3001/api/health' -TimeoutSec 5 -UseBasicParsing | Select-Object -ExpandProperty StatusCode } catch { exit 1 }"
    port: 3001
    depends_on: []

  frontend:
    start: npm --prefix frontend run dev
    stop: powershell -Command "Get-NetTCPConnection -LocalPort 5173 -ErrorAction SilentlyContinue | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }"
    healthcheck: powershell -Command "try { Invoke-WebRequest -Uri 'http://localhost:5173' -TimeoutSec 5 -UseBasicParsing | Select-Object -ExpandProperty StatusCode } catch { exit 1 }"
    port: 5173
    depends_on: [server]
