server {
  listen 80;
  server_name _;

  # Safe default for normal API calls (JSON). The upload route below
  # overrides this to match the backend 500 MB cap.
  client_max_body_size 1m;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://server:3001;
  }

  # File uploads to the VPS. Capped at the backend limit so oversized
  # requests get a 413 at the proxy, before buffering and backend memory.
  location ~ ^/api/files/upload {
    client_max_body_size 500m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://server:3001;
  }

  location /ws {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_pass http://server:3001/ws;
  }

  # Manual-control VNC sessions (websockify ports are assigned per session).
  # The upstream port is dynamic, so Docker's embedded DNS is required.
  location ~ ^/vnc/(?<vncport>\d+)/(?<vncpath>.*)$ {
    resolver 127.0.0.11 valid=30s;
    proxy_read_timeout 90s;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_pass http://server:$vncport/$vncpath$is_args$args;
  }
}
