server {
  listen 80;
  server_name _;

  # Safe default for normal API calls (JSON). The upload route below
  # overrides this to match the backend 50 MiB cap.
  client_max_body_size 1m;

  root /usr/share/nginx/html;
  index index.html;

  # Content hashes change on each update; reuse shell code and styles across visits.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/wasm image/svg+xml;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # Account login can wait for Instagram and authenticator verification.
  location ~ ^/api/ig-accounts/[^/]+/connect$ {
    proxy_read_timeout 360s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://server:3001;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://server:3001;
  }

  location /api/ig-accounts/models/ {
    client_max_body_size 16m;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://server:3001;
  }

  # Stream directly to the browser worker; never spool uploads to disk.
  location ~ ^/api/displays/\d+/file-picker$ {
    client_max_body_size 51m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://server:3001;
  }

  location /ws {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_pass http://server:3001/ws;
  }

  location ~ ^/api/chat/[^/]+/threads/[^/]+/attachment$ {
    client_max_body_size 25m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://server:3001;
  }

  # The server's Rust gateway connects to loopback-only RFB displays.
  location ~ ^/vnc/(?<vncport>\d+)/(?<vncpath>.*)$ {
    resolver 127.0.0.11 valid=30s;
    proxy_read_timeout 90s;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_pass http://server:3003/vnc/$vncport/$vncpath$is_args$args;
  }
}
